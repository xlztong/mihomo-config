# ==================== 分流规则 ====================
rules:
  # SSH 端口直连（避免机场屏蔽22端口）
  - DST-PORT,22,DIRECT

  # 游戏直连（避免代理/TUN 影响延迟和稳定性）
  - PROCESS-NAME,wegame.exe,DIRECT
  - PROCESS-NAME,wegame_env.exe,DIRECT
  - PROCESS-NAME,icreateLol.exe,DIRECT
  - PROCESS-NAME,LeagueClient.exe,DIRECT
  - PROCESS-NAME,LeagueClientUx.exe,DIRECT
  - PROCESS-NAME,LeagueClientUxRender.exe,DIRECT
  - PROCESS-NAME,LeagueCrashHandler64.exe,DIRECT
  - PROCESS-NAME,League of Legends.exe,DIRECT
  - DOMAIN-SUFFIX,17roco.qq.com,DIRECT
  - DOMAIN-SUFFIX,roco.qq.com,DIRECT
  - DOMAIN-SUFFIX,rocom.qq.com,DIRECT

  # 局域网直连
  - RULE-SET,Lan,DIRECT

  # 广告拦截
  - RULE-SET,Advertising,Final
  - RULE-SET,Privacy,Final

  # AI 服务 -> OpenAI 组
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,Claude,OpenAI
  - RULE-SET,Copilot,OpenAI
  - RULE-SET,Gemini,OpenAI

  # YouTube
  - RULE-SET,YouTube,Google

  # Google
  - RULE-SET,Google,Google

  # Telegram
  - RULE-SET,Telegram,Telegram

  # Steam
  - RULE-SET,Steam,Outbound

  # TradingView
  - DOMAIN-SUFFIX,tradingview.com,Outbound

  # Crypto
  - RULE-SET,Crypto,Outbound
  - RULE-SET,Cryptocurrency,Outbound

  # 国内/HK 云厂商纯 IP 直连
  - RULE-SET,ChinaIPs,DIRECT
  - IP-CIDR,43.129.104.0/21,DIRECT,no-resolve

  # 国外代理
  - RULE-SET,Global,Outbound

  # 中国直连
  - RULE-SET,ChinaMaxNoIP,DIRECT
  - RULE-SET,China,DIRECT

  # GeoIP 中国直连
  - GEOIP,CN,DIRECT

  # 兜底规则
  - MATCH,Final
