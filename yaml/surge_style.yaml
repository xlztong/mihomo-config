# Surge 风格分流配置 - 适用于 Mihomo Party
# 规则来源: https://github.com/blackmatrix7/ios_rule_script

# ==================== DNS ====================
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  listen: 0.0.0.0:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - GEOSITE,private,real-ip
    - GEOSITE,connectivity-check,real-ip
    - GEOSITE,cn,real-ip
    - RULE-SET,ChinaMaxNoIP,real-ip
    - RULE-SET,China,real-ip
    - MATCH,fake-ip
  default-nameserver:
    - 223.5.5.5
  nameserver-policy:
    "geosite:private":
      - system
    "geosite:connectivity-check":
      - https://223.5.5.5/dns-query#DIRECT&h3=true
    "geosite:cn":
      - https://223.5.5.5/dns-query#DIRECT&h3=true
    "rule-set:ChinaMaxNoIP":
      - https://223.5.5.5/dns-query#DIRECT&h3=true
    "rule-set:China":
      - https://223.5.5.5/dns-query#DIRECT&h3=true
    "geosite:geolocation-!cn":
      - https://8.8.8.8/dns-query#Outbound
  nameserver:
    - https://223.5.5.5/dns-query#DIRECT&h3=true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT&h3=true
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT&h3=true
  direct-nameserver-follow-policy: false

# ==================== 代理组 ====================
proxy-groups:
  # 主出站选择
  - name: Outbound
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Flower.png
    type: select
    proxies:
      - HK
      - NNC链式
      - JP
      - SG
      - US
      - TW
      - Manual
      - DIRECT

  # Google - 默认走美国
  - name: Google
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Google.png
    type: select
    proxies:
      - US
      - HK
      - JP
      - SG
      - TW
      - Outbound

  # Telegram - 走 Outbound
  - name: Telegram
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Telegram.png
    type: select
    proxies:
      - Outbound
      - HK
      - SG
      - US

  # OpenAI/AI服务 - 默认走美国
  - name: OpenAI
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/OpenAI.png
    type: select
    proxies:
      - US
      - JP
      - SG
      - TW
      - Outbound

  # Final 兜底 - 走 Outbound
  - name: Final
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png
    type: select
    proxies:
      - Outbound
      - DIRECT
      - HK
      - US

  # ==================== 地区节点组 ====================
  - name: HK
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png
    type: select
    use:
      - HK

  - name: JP
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/JP.png
    type: select
    use:
      - JP

  - name: SG
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/SG.png
    type: select
    use:
      - SG

  - name: US
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/US.png
    type: select
    use:
      - US

  - name: TW
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/TW.png
    type: select
    use:
      - TW

  # 花云香港节点 - 作为 NNC 的可选前置
  - name: 花云HK
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png
    type: select
    use:
      - HuaYun-HK

  # 链式代理：花云 HK -> NNC -> 目标
  - name: NNC链式
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Personal.png
    type: select
    use:
      - NNC-Chain

  # 手动选择 - 列出所有节点
  - name: Manual
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
    type: select
    use:
      - All

proxy-providers:
  # 地区节点订阅 (Sub-Store 筛选)
  HK:
    type: http
    url: "http://127.0.0.1:38324/download/collection/HK?target=ClashMeta&includeUnsupportedProxy=true"
    interval: 3600
    path: ./proxy_providers/HK.yaml

  JP:
    type: http
    url: "http://127.0.0.1:38324/download/collection/JP?target=ClashMeta&includeUnsupportedProxy=true"
    interval: 3600
    path: ./proxy_providers/JP.yaml

  SG:
    type: http
    url: "http://127.0.0.1:38324/download/collection/SG?target=ClashMeta&includeUnsupportedProxy=true"
    interval: 3600
    path: ./proxy_providers/SG.yaml

  US:
    type: http
    url: "http://127.0.0.1:38324/download/collection/US?target=ClashMeta&includeUnsupportedProxy=true"
    interval: 3600
    path: ./proxy_providers/US.yaml

  TW:
    type: http
    url: "http://127.0.0.1:38324/download/collection/TW?target=ClashMeta&includeUnsupportedProxy=true"
    interval: 3600
    path: ./proxy_providers/TW.yaml

  All:
    type: http
    url: "http://127.0.0.1:38324/download/collection/All?target=ClashMeta&includeUnsupportedProxy=true"
    interval: 3600
    path: ./proxy_providers/All.yaml

  # 花云香港节点，专用于 NNC 链式代理的前置选择
  HuaYun-HK:
    type: http
    url: "http://127.0.0.1:38324/download/collection/HuaYun-HK?target=ClashMeta&includeUnsupportedProxy=true"
    interval: 3600
    path: ./proxy_providers/HuaYun-HK.yaml

  # 从自建集合中只取 NNC，并通过花云 HK 建立连接
  NNC-Chain:
    type: http
    url: "http://127.0.0.1:38324/download/collection/Self?target=ClashMeta&includeUnsupportedProxy=true"
    interval: 3600
    path: ./proxy_providers/NNC-Chain.yaml
    filter: "(?i)NNC"
    override:
      additional-prefix: "[链式] "
      dialer-proxy: 花云HK

